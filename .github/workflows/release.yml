name: Release to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v1.2.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # - name: Checkout code
      #   uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version in pom.xml
        run: |
          mvn versions:set -DnewVersion=${{ steps.get_version.outputs.VERSION }}
          mvn versions:commit

      - name: Update version.properties
        run: |
          echo "version=${{ steps.get_version.outputs.VERSION }}" > src/main/resources/version.properties
          echo "build.time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> src/main/resources/version.properties

      - name: Build and test
        run: mvn clean verify

      - name: Publish to GitHub Packages
        run: mvn deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## lib-version ${{ steps.get_version.outputs.VERSION }}
            
            Version-aware library for SMS Checker application.
            
            ### Installation
            Add to your `pom.xml`:
            ```xml
            <dependency>
              <groupId>team6</groupId>
              <artifactId>lib-version</artifactId>
              <version>${{ steps.get_version.outputs.VERSION }}</version>
            </dependency>
            ```
            
            Configure GitHub Packages repository:
            ```xml
            <repositories>
              <repository>
                <id>github</id>
                <url>https://maven.pkg.github.com/doda25-team6/lib-version</url>
              </repository>
            </repositories>
            ```
          draft: false
          prerelease: false

      - name: Compute next SNAPSHOT version
        id: next_version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          next_patch=$((patch + 1))
          NEXT_VERSION="${major}.${minor}.${next_patch}-SNAPSHOT"
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Update version to next SNAPSHOT in pom.xml
        run: |
          mvn versions:set -DnewVersion=${{ steps.next_version.outputs.next_version }}
          mvn versions:commit

      - name: Update version.properties to next SNAPSHOT
        run: |
          echo "version=${{ steps.next_version.outputs.next_version }}" > src/main/resources/version.properties
          echo "build.time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> src/main/resources/version.properties
          echo "artifact.name=lib-version" >> src/main/resources/version.properties
          echo "artifact.description=SMS Checker Version Library" >> src/main/resources/version.properties

      - name: Commit and push next SNAPSHOT version (to branch)
        env:
          NEXT: ${{ steps.next_version.outputs.next_version }}
        run: |
          set -e
          BRANCH="bump-snapshot-${NEXT}"
          git checkout -b "$BRANCH"

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add pom.xml src/main/resources/version.properties
          git commit -m "Bump version to ${NEXT} after release"
          git push origin "$BRANCH"

      - name: Create PR to main for SNAPSHOT bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.next_version.outputs.next_version }}
        run: |
          gh pr create \
            --title "Bump to ${NEXT} after release" \
            --body "Automated post-release bump to next SNAPSHOT version." \
            --base main \
            --head "bump-snapshot-${NEXT}"

