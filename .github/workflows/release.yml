name: Release to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v1.2.3, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version in pom.xml
        run: |
          mvn versions:set -DnewVersion=${{ steps.get_version.outputs.VERSION }}
          mvn versions:commit

      - name: Update version.properties
        run: |
          echo "version=${{ steps.get_version.outputs.VERSION }}" > src/main/resources/version.properties
          echo "build.time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> src/main/resources/version.properties

      - name: Build and test
        run: mvn clean verify

      - name: Publish to GitHub Packages
        run: mvn deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## lib-version ${{ steps.get_version.outputs.VERSION }}
            
            Version-aware library for SMS Checker application.
            
            ### Installation
            Add to your `pom.xml`:
            ```xml
            <dependency>
              <groupId>team6</groupId>
              <artifactId>lib-version</artifactId>
              <version>${{ steps.get_version.outputs.VERSION }}</version>
            </dependency>
            ```
            
            Configure GitHub Packages repository:
            ```xml
            <repositories>
              <repository>
                <id>github</id>
                <url>https://maven.pkg.github.com/doda25-team6/lib-version</url>
              </repository>
            </repositories>
            ```
          draft: false
          prerelease: false
